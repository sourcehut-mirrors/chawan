<!DOCTYPE html>
<title>Test shadow root</title>
<div id=x>Fail</div>
<div id=y>Fail if visible</div>
<div id=z></div> <!-- test empty shadow root -->
<script src=asserts.js></script>
<script>
const el = document.getElementById("y");
const shadow = el.attachShadow({mode: "open"})
{
	assertEquals(shadow.mode, "open");
	assertEquals(shadow.delegatesFocus, false);
	assertEquals(shadow.slotAssignment, "named");
	assertEquals(shadow.clonable, false);
	assertEquals(shadow.serializable, false);
	assertEquals(shadow.nextSibling, null);
	assertEquals(shadow.previousSibling, null);
	assertEquals(el.firstChild.previousSibling, null);
	assertEquals(shadow.getRootNode(), shadow);
	assertEquals(shadow.getRootNode({composed: true}), document);
	assertInstanceof(el.firstChild, Text);
}
{
	shadow.innerHTML = "<div id=test-id>test</div>";
	assertEquals(shadow.firstElementChild.id, "test-id");
	assertEquals(document.getElementById("test-id"), null);
	assertEquals(window["test-id"], undefined);
	const x = shadow.getElementById("test-id");
	assertEquals(x.id, "test-id");
	x.remove();
	assertEquals(shadow.getElementById("test-id"), null);
}
{
	shadow.innerHTML = "<div id=test-remove>test</div>";
	const x = shadow.getElementById("test-remove");
	el.remove();
	assertEquals(x.getRootNode(), shadow);
	x.remove();
}
{
	z.attachShadow({mode: "open"});
}
shadow.append("Success")
x.before(shadow);
document.getElementById("x").remove();
</script>
