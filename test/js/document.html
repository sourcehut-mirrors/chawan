<!doctype html>
<title>Document test</title>
<body>
<div id="abc">Fail</div>
<img id=img2 name=img3>
<img id=toString name=a>
<img id=img4 name=>
<form id=myform name=asdf></form>
<script src=asserts.js></script>
<script>
assertEquals(document.toString, document.getElementById("toString"));
assertThrows(() => document.remove(), TypeError);
document.toString.remove();
document.testtest = "hi";
assertEquals(document.ELEMENT_NODE, 1);
assertEquals(Document.ELEMENT_NODE, 1);
assertEquals(document.getElementsByName("").length, 0);
assertEquals(Object.getOwnPropertyNames(document).toString(), "location,testtest,img2,img3,asdf");
/*
 * Note: the spec says Document == HTMLDocument, but in other browsers
 * this is not true.
 */
if (HTMLDocument == Document)
	assertEquals(document.toString(), "[object Document]");
assertEquals(document, window.document);
assertEquals(document.implementation, document.implementation);
assertEquals(document.img2, document.getElementById("img2"));
assertEquals(document.img3, document.getElementById("img2"));
assertEquals(document.asdf, document.getElementById("myform"));
assertEquals(document.img4, undefined);
assertEquals(document.implementation.createHTMLDocument(null).title, "null");
assertEquals(document.implementation.createDocument.length, 2);
assertThrows(() => document.implementation.createDocument(null), TypeError);
document.getElementById("img4").remove();
document.asdf.remove();
document.img2.remove();
assertEquals(document.scrollingElement, document.documentElement);
abc.insertBefore(document.createElement("head"), null);
document.head.remove();
assertEquals(document.head, null);
{
	const locationDesc = Object.getOwnPropertyDescriptor(document, "location");
	assertInstanceof(locationDesc.get, Function);
	assertInstanceof(locationDesc.set, Function);
	assertEquals(locationDesc.enumerable, true);
	assertEquals(locationDesc.configurable, false);
}
document.getElementById("abc").textContent = "Success";
</script>
