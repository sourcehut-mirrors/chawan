<!doctype html>
<title>Element class test</title>
<div class="a b c">Fail</div>
<script src=asserts.js></script>
<script>
const div = document.getElementsByClassName("a")[0]
const classes = ["a", "b", "c"];
let cl = div.classList;
for (let i = 0; i < classes.length; ++i)
	assertEquals(cl[i], classes[i]);
cl.remove("a");
assertEquals(div.getAttribute("class"), "b c");
cl.remove("b");
cl.remove("c");
assertEquals(div.getAttribute("class"), "");
const classes2 = ["x", "y", "z"];
div.setAttribute("class", classes2.join(' '));
let i = 0;
for (let x of cl)
	assertEquals(x, classes2[i++]);
{
	let el = document.createElementNS("", "test");
	el.className = "hi";
	assertEquals(el.__proto__, Element.prototype);
	assertEquals(el.getAttribute("class"), "hi");
}
{
	const coll1 = document.getElementsByClassName("a");
	assertEquals(coll1, document.getElementsByClassName("a"));
	const coll2 = document.getElementsByClassName("a b")
	assertEquals(coll2, document.getElementsByClassName("a b"));
	assertNotEquals(coll2, document.getElementsByClassName("a  b"));
}
{
	const doc = document.implementation.createHTMLDocument();
	const el = doc.createElement("div");
	el.setAttribute("class", "div test test hi world asdf asdfghijkl");
	el.classList;
	el.setAttribute("class", "");
	assertEquals(el.classList+"", "");
}
div.textContent = "Success";
</script>
