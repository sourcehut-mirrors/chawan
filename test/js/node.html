<!doctype html>
<title>Node test</title>
<div id=x>Fail</div>
<script src=asserts.js></script>
<script>
let doc = new Document();
let text = doc.createTextNode("test");
let elem = document.createElement("div");
elem.append(text);
assertEquals(text.ownerDocument, document);
assert(!document.contains(null)); /* no idea why this is allowed */
assertEquals(new Document().createCDATASection("test").cloneNode().data, "test");
assertInstanceof(new Document().createCDATASection("test"), Text);
assert(!new Document().createCDATASection("a").isEqualNode(new Text("a")));
assert(new Text("a").isEqualNode(new Text("a")));
{	/* isEqualNode */
	const el = document.createElement("div");
	assertEquals(el.isEqualNode(document), false);
	/* the spec implies this should produce false, but others all
	   return true */
	const xdoc = document.implementation.createDocument("", null);
	const doc = new Document();
	assertEquals(xdoc.isEqualNode(doc), true);
	let shadow = el.attachShadow({mode: "open"});
	/* ok, this makes sense */
	assertEquals(xdoc.isEqualNode(shadow), false);
	/* ...but this doesn't.  I guess everybody forgot about ShadowRoot? */
	assertEquals(shadow.isEqualNode(new DocumentFragment()), true);
}
{	/* childNodes */
	assertEquals(document.childNodes, document.childNodes);
	const element = document.createElement("div");
	assertEquals(element.childNodes, element.childNodes);
	const text = new Text();
	assertEquals(text.childNodes, text.childNodes);
	const frag = new DocumentFragment()
	assertEquals(frag.childNodes, frag.childNodes);
	const comment = new Comment();
	assertEquals(comment.childNodes, comment.childNodes);
}
document.getElementById("x").textContent = "Success";
</script>
