<!doctype html>
<title>Form/form control tests</title>
<div id=x>Fail</div>
<form id=test>
<input id=1 name=input onchange="globalThis.onchangeCalled = true">
<input id=0 name=input>
<textarea id=ta>test test</textarea>
</form>
<input id=outside form=test name=outside value="hi">
<script src=asserts.js></script>
<script>
(function() { /* button */
	const x = document.createElement("button");
	x.type = "test";
	assertEquals(x.type, "submit");
	assertEquals(x.getAttribute("type"), "test");
	x.type = "button";
	assertEquals(x.type, "button");
	x.value = "test";
	assertEquals(x.getAttribute("value"), "test");
	assertEquals(document.getElementsByName("input").length, 2);
})();
(function() { /* form */
	const form = document.forms[0];
	const test = document.getElementById("test");
	assertEquals(form, test);
	assertEquals(document.forms["test"], test);
	const elements = form.elements;
	assertEquals(elements.length, form.length);
	assertEquals(elements["a"], undefined);
	assertInstanceof(elements[0], HTMLInputElement);
	assertEquals(elements[0].id, "1");
	globalThis.onchangeCalled = false;
	elements[0].dispatchEvent(new Event("change"));
	assert(globalThis.onchangeCalled);
	assertEquals(elements["0"].id, "1");
	assertEquals(elements[0].name, "input");
	assertInstanceof(elements["input"], RadioNodeList);
	assertEquals(elements[2].id, "ta");
	assertEquals(elements[2].value, "test test");
	elements[2].defaultValue = "";
	assertEquals(elements[2].value, "");
	assertEquals(elements[3].name, "outside")
	const outside = elements[3];
	form.remove();
	assertEquals(elements[3], undefined)
	let el = elements[0];
	el.remove();
	el.remove();
	elements[0].remove();
	elements[0].remove();
	outside.remove();
	x.after(form);
})();
(function() { /* select */
	let test = document.forms[0];
	let select = document.createElement("select");
	test.append(select);
	let option = document.createElement("option");
	assert(!option.selected);
	option.setAttribute("selected", "");
	assert(option.selected)
	option.removeAttribute("selected");
	assert(!option.selected)
	select.append(option);
	select.remove("test");
	assertEquals(option.parentNode, null);
	assertEquals(select.parentNode, test);
	select.remove();
})();
(function() { /* FormData */
	const formData = new FormData();
	formData.append("test", "a");
	assertThrows(() => formData.append("test", "b", {
		toString: function() { throw new Error("test"); }
	}), TypeError);
	assertThrows(() => new FormData(null), TypeError);
	assertEquals(formData.get("test"), "a");
	assertEquals(FileList.prototype[Symbol.iterator],
		Array.prototype[Symbol.iterator]);
})();
(function() { /* label */
	const doc = document.implementation.createHTMLDocument();
	doc.documentElement.innerHTML = `
<meter id=x>meter</meter>
<label id=y for=x>label</label>
<label id=z><input type=hidden>test</input></label>
<label id=wrong for=non-existent>label<input name=hi></label>
<label id=wrong2 for>label<input name=hi></label>
<input id name=wat>
`;
	const label = doc.getElementById("y");
	const meter = label.control;
	assertEquals(meter, doc.getElementById("x"));
	assertInstanceof(meter, HTMLMeterElement);
	const label2 = doc.getElementById("z");
	assertEquals(label2.control, null);
	const wrong = doc.getElementById("wrong");
	assertEquals(wrong.control, null);
	const wrong2 = doc.getElementById("wrong2");
	assertEquals(wrong2.control, null);
})();
document.getElementById("x").textContent = "Success";
</script>
