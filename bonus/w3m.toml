# w3m-like keybindings for Chawan.
# Copy-paste this into your config file, or just include it (place it in
# ~/.chawan/w3m.toml or ~/.config/chawan/w3m.toml, then at the beginning of
# ~/.chawan/config.toml, include = "w3m.toml".)

# these are disabled by default in w3m
[status]
show-cursor-position = false
show-hover-link = false

[cmd.w3m]
pageDown = '(n = 1) => buffer.scrollDown(buffer.height * n)'
pageUp = '(n = 1) => buffer.scrollUp(buffer.height * n)'
mark = '''
() => {
	/* id is always the current position; this way we can clear by
	   setting a mark twice at the same position. */
	const id = buffer.cursorx + " " + buffer.cursory;
	if (!buffer.getMarkPos(id))
		buffer.setMark(id);
	else
		buffer.clearMark(id);
}
'''
gotoLine = 'n => pager.gotoLine(n)'
centerColumn = '() => buffer.centerColumn()'
centerLine = '() => buffer.centerLine()'
prevMark = '''
() => {
	const next = buffer.findPrevMark();
	if (next)
		buffer.gotoMark(next);
	else
		pager.alert("No mark exists before here");
}
'''
nextMark = '''
() => {
	const next = buffer.findNextMark();
	if (next)
		buffer.gotoMark(next);
	else
		pager.alert("No mark exists before here");
}
'''
editFile = '''
() => {
	if (buffer.url.protocol == "file:")
		pager.extern(pager.getEditorCommand(buffer.url.pathname))
	else
		pager.alert("Can't edit other than local file");
}
'''
askQuit = '''
() => pager.ask("Do you want to exit Chawan?").then(x => x ? quit() : void(0))
'''
cursorUp = '(n = 1) => buffer.setCursorYCenter(buffer.cursory - n)'
cursorDown = '(n = 1) => buffer.setCursorYCenter(buffer.cursory + n)'
cursorLeft = '(n = 1) => buffer.setCursorXCenter(buffer.cursorx - n)'
cursorRight = '(n = 1) => buffer.setCursorXCenter(buffer.cursorx + n)'

