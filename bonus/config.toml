# Siteconf can be used to override most [buffer] and [network] rules for
# specific URLs.  Example:
#
#[siteconf.wikipedia]
#url = '^https?://[a-z]+\.wikipedia\.org/wiki/(?!.*useskin=.*)'
#rewrite-url = 'x => x.searchParams.append("useskin", "vector")'
#cookie = true

[page]
# Put pager keybindings here.  The syntax is elaborated upon in
# cha-config(5); in short:
# a = 'command' # bind key "a" to command
# 'a b' = 'command' # bind key sequence "a b" to command
# RET = 'command' # bind return key to command
# C-a = 'command' # bind CTRL + a to command
# M-a = 'command' # bind Meta (usually Alt or Escape) + a to command
# Tab = 'pager.alert("Hello, world!")' # bind tab to JS expression
# a = 'n => pager.alert("Hello, world! " + n)' # get the numeric prefix in JS
# Following are the defaults.
#'y u' = 'copyCursorLink'
#'y I' = 'copyCursorImage'
#h = 'cursorLeft'
#j = 'cursorDown'
#k = 'cursorUp'
#l = 'cursorRight'
#Left = 'cursorLeft'
#Down = 'cursorDown'
#Up = 'cursorUp'
#Right = 'cursorRight'
#C-n = 'cursorDown'
#C-p = 'cursorUp'
